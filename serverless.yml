service: banking-api-assessment

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs18.x
  stage: local
  region: ${env:AWS_REGION, 'us-east-1'}
  environment:
    DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, 'http://localhost:8000'}
    CUSTOMERS_TABLE:   ${env:CUSTOMERS_TABLE,   'Customers'}
    ACCOUNTS_TABLE:    ${env:ACCOUNTS_TABLE,     'Accounts'}
    IDEMPOTENCY_TABLE: ${env:IDEMPOTENCY_TABLE,  'Idempotency'}
    USERS_TABLE:       ${env:USERS_TABLE,        'Users'}
    JWT_SECRET:        ${env:JWT_SECRET,         'dev-secret-change-in-production-min-32-chars'}
    JWT_EXPIRES_IN:    ${env:JWT_EXPIRES_IN,     '24h'}
  # IAM is unused for local DynamoDB; kept for realism if you later deploy to AWS
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource: "*"

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true

functions:
  # ── Lambda Authorizer ───────────────────────────────────────────────────────
  jwtAuthorizer:
    handler: src/handlers/auth.jwtAuthorizer

  # ── Public routes (no JWT required) ────────────────────────────────────────
  docsUi:
    handler: src/handlers/docs.ui
    events:
      - http:
          path: docs
          method: get

  openapiSpec:
    handler: src/handlers/docs.openapi
    events:
      - http:
          path: openapi.yaml
          method: get

  # ── Auth routes (public) ────────────────────────────────────────────────────
  authRegister:
    handler: src/handlers/auth.register
    events:
      - http:
          path: auth/register
          method: post

  authLogin:
    handler: src/handlers/auth.login
    events:
      - http:
          path: auth/login
          method: post

  # ── Protected routes ────────────────────────────────────────────────────────
  createCustomer:
    handler: src/handlers/customers.create
    events:
      - http:
          path: customers
          method: post
          authorizer: jwtAuthorizer

  getCustomer:
    handler: src/handlers/customers.get
    events:
      - http:
          path: customers/{customerId}
          method: get
          authorizer: jwtAuthorizer

  createAccount:
    handler: src/handlers/accounts.create
    events:
      - http:
          path: customers/{customerId}/accounts
          method: post
          authorizer: jwtAuthorizer

  listAccounts:
    handler: src/handlers/accounts.list
    events:
      - http:
          path: customers/{customerId}/accounts
          method: get
          authorizer: jwtAuthorizer

  getAccount:
    handler: src/handlers/accounts.get
    events:
      - http:
          path: accounts/{accountId}
          method: get
          authorizer: jwtAuthorizer

  deposit:
    handler: src/handlers/transactions.deposit
    events:
      - http:
          path: accounts/{accountId}/deposits
          method: post
          authorizer: jwtAuthorizer

  withdraw:
    handler: src/handlers/transactions.withdraw
    events:
      - http:
          path: accounts/{accountId}/withdrawals
          method: post
          authorizer: jwtAuthorizer

  transfer:
    handler: src/handlers/transactions.transfer
    events:
      - http:
          path: transfers
          method: post
          authorizer: jwtAuthorizer
